name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node --check ./bin/cli.mjs
      - run: node -e "for (const f of ['package.json', 'server.json', 'glama.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'));"
